# AM40 (RK3399)：mediasrv 垫片
#  - RK3399 没有 AV1/VP8 硬解 -> 隐藏 av1_rkmpp/vp8_rkmpp，让 mediasrv 走软件解码
#  - RK3399 没有 HEVC 硬编      -> 把做不到的 *_rkmpp 硬编改成 h264_rkmpp
#  - 日志级别临时开到 debug，方便排查播放/转码问题
# 详细说明见 /boot/AM40-刷机说明.md；重装/卸载： sudo am40-fix-mediasrv [--status|--remove]
[Service]
Environment=LD_PRELOAD=/usr/local/lib/mediasrv-shim.so
ExecStart=
ExecStart=/usr/trim/bin/mediasrv -o /usr/trim/logs/mediasrv.log -a /var/run/mediasrv.socket -l debug
